<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accordion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem;
      background: #ffffff;
      color: #222;
    }
    .accordion {
      max-width: 800px;
      margin: 0 auto;
      border-radius: 4px;
      border: 1px solid #ddd;
      overflow: hidden;
    }
    .accordion-item + .accordion-item {
      border-top: 1px solid #ddd;
    }
    .accordion-header {
      cursor: pointer;
      padding: 0.75rem 1rem;
      background: #f5f5f5;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .accordion-header:focus {
      outline: 2px solid #0052cc;
      outline-offset: -2px;
    }
    .accordion-icon {
      margin-left: 0.5rem;
      transition: transform 0.2s ease;
    }
    .accordion-item.open .accordion-icon {
      transform: rotate(90deg);
    }
    .accordion-content {
      display: none;
      padding: 0.75rem 1rem 1rem;
      background: #fff;
    }
    .accordion-item.open .accordion-content {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Course Accordion</h1>
  <div class="accordion" role="tablist">
    <div class="accordion-item open">
      <button class="accordion-header" type="button">
        <span>Section 1 – Introduction</span>
        <span class="accordion-icon">▶</span>
      </button>
      <div class="accordion-content">
        <p>Put your intro text here. You can include links, simple formatting, etc.</p>
      </div>
    </div>
    <div class="accordion-item">
      <button class="accordion-header" type="button">
        <span>Section 2 – Details</span>
        <span class="accordion-icon">▶</span>
      </button>
      <div class="accordion-content">
        <p>More detailed content, steps, images (linked), etc.</p>
      </div>
    </div>
    <div class="accordion-item">
      <button class="accordion-header" type="button">
        <span>Section 3 – Summary</span>
        <span class="accordion-icon">▶</span>
      </button>
      <div class="accordion-content">
        <p>Summary and key takeaways.</p>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const item = header.closest('.accordion-item');
        const isOpen = item.classList.contains('open');
        // Optional: close other items (classic accordion behaviour)
        document.querySelectorAll('.accordion-item').forEach(i => {
          i.classList.remove('open');
        });
        if (!isOpen) {
          item.classList.add('open');
        }
      });
    });
  </script>
</body>
</html>
